name: Fotos por localização

# Fotos por localização (D-057): procura no Wikimedia Commons fotos livres tiradas perto dos lugares
# que não têm foto. Todo dia, 3.000 do Brasil (turísticos mais conhecidos primeiro) ainda não procurados (cada um é revisto a cada
# 90 dias). Rodar à mão escolhendo cidades: campo "destinos". OIDC do GitHub; nenhuma chave.
on:
  workflow_dispatch:
    inputs:
      destinos:
        description: 'IDs das cidades separados por vírgula (vazio = todas)'
        required: false
        default: 'br-2611606,br-2609600,br-2605459,br-2604106,br-2607208'
      pais:
        description: 'País (prefixo do id, ex.: br). Vazio = todos'
        required: false
        default: 'br'
      limite:
        description: 'Quantos lugares procurar'
        required: false
        default: '3000'
  schedule:
    - cron: '41 6 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/fotos-commons.yml
      - tools/dados/fotos-commons.mjs

permissions:
  contents: read
  id-token: write

concurrency:
  group: fotos-commons
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pernambuco primeiro (no push) ou o que foi pedido
        env:
          DESTINOS: ${{ github.event_name == 'push' && 'br-2611606,br-2609600,br-2605459,br-2604106,br-2607208' || inputs.destinos || '' }}
          LIMITE: ${{ inputs.limite || '3000' }}
          PAIS: ${{ github.event_name == 'workflow_dispatch' && inputs.pais || 'br' }}
        run: node tools/dados/fotos-commons.mjs --pais "$PAIS" --destinos "$DESTINOS" --limite "$LIMITE"
