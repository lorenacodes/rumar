name: Fotos por localização

# Fotos por localização (D-057): procura no Wikimedia Commons fotos livres tiradas perto dos lugares
# sem foto. Todo dia, até atingir 1.000 fotos novas (ou 150 min), região por região do Brasil, a
# começar pelo Nordeste; em cada região, os turísticos mais conhecidos primeiro. Cada lugar é revisto
# a cada 90 dias. À mão: escolher região, meta ou cidades. OIDC do GitHub; nenhuma chave.
on:
  workflow_dispatch:
    inputs:
      regiao:
        description: 'nordeste | sudeste | sul | centro-oeste | norte (as outras vêm depois)'
        required: false
        default: 'nordeste'
      meta:
        description: 'Fotos novas a buscar'
        required: false
        default: '1000'
      destinos:
        description: 'Só estas cidades (ids separados por vírgula; vazio = por região)'
        required: false
        default: ''
  schedule:
    - cron: '41 6,14,22 * * *' # 3 rodadas por dia (meta de 1.000 fotos/dia)
  push:
    branches: [main]
    paths:
      - .github/workflows/fotos-commons.yml
      - tools/dados/fotos-commons.mjs
      - tools/dados/fotos-regras.mjs

permissions:
  contents: read
  id-token: write

concurrency:
  group: fotos-commons
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar fotos
        env:
          REGIAO: ${{ inputs.regiao || 'nordeste' }}
          META: ${{ inputs.meta || '1000' }}
          DESTINOS: ${{ inputs.destinos || '' }}
        run: node tools/dados/fotos-commons.mjs --pais br --regiao "$REGIAO" --meta "$META" --destinos "$DESTINOS" --minutos 150
