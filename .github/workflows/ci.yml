name: CI

on:
  push:
    branches: [main, 'fase-*']
  pull_request:

jobs:
  checar:
    name: Tipos, testes e teste visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dev-telas --workspace @rumar/app
      - run: npx playwright install --with-deps chromium
      - name: Comparar telas com o design (limite 2%)
        run: npm run visual
      - name: Guardar capturas e diferenças
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-visual
          path: tools/visual/out/

  android:
    name: APK de teste (Android)
    needs: checar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build --workspace @rumar/app
      - run: npx cap sync android
        working-directory: apps/app
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/app/android
      - uses: actions/upload-artifact@v4
        with:
          name: rumar-debug-apk
          path: apps/app/android/app/build/outputs/apk/debug/*.apk
      - name: Publicar o APK como versão de teste (link direto para o celular)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/app/android/app/build/outputs/apk/debug/app-debug.apk rumar-teste.apk
          TAG="apk-teste-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" rumar-teste.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de teste · ${GITHUB_REF_NAME}" \
            --notes "Versão de teste gerada automaticamente a partir de ${GITHUB_SHA::7}. Baixe rumar-teste.apk no celular Android e instale (permita instalar de fontes desconhecidas)."
