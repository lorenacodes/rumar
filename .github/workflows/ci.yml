name: CI

on:
  # Só no branch de trabalho: o main recebe o mesmo conteúdo logo depois, e o app busca o APK de
  # apk-teste-fase-0-base. Rodar nos dois dobrava os minutos (custo se o repositório ficar privado).
  push:
    branches: ['fase-*']
  pull_request:

jobs:
  checar:
    name: Tipos, testes e teste visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dev-telas --workspace @rumar/app
      - run: npx playwright install --with-deps chromium
      - name: Comparar telas com o design (limite 2%)
        run: npm run visual
      - name: Guardar capturas e diferenças
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-visual
          path: tools/visual/out/

  android:
    name: APK de teste (Android)
    needs: checar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build --workspace @rumar/app
      - run: npx cap sync android
        working-directory: apps/app
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/app/android
      - uses: actions/upload-artifact@v4
        with:
          name: rumar-debug-apk
          path: apps/app/android/app/build/outputs/apk/debug/*.apk
      - name: Publicar o APK como versão de teste (link direto para o celular)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/app/android/app/build/outputs/apk/debug/app-debug.apk bovair-teste.apk
          TAG="apk-teste-${GITHUB_REF_NAME//\//-}"
          # O app lê este arquivo para avisar "Nova versão disponível · Atualizar".
          printf '{"versionCode":%s,"apk":"https://github.com/%s/releases/download/%s/bovair-teste.apk","commit":"%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$TAG" "${GITHUB_SHA::7}" > versao.json
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" bovair-teste.apk versao.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de teste Bo Vair · ${GITHUB_REF_NAME}" \
            --notes "Versão de teste gerada automaticamente a partir de ${GITHUB_SHA::7}. Baixe bovair-teste.apk no celular Android e instale (permita instalar de fontes desconhecidas)."
          # Às vezes o GitHub deixa a versão como rascunho (aí o link de download dá 404): garante publicada e confere.
          for i in 1 2 3; do
            gh release edit "$TAG" --draft=false --prerelease && break
            sleep 5
          done
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
