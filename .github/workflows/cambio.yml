name: Câmbio

# Cotação oficial do Banco Central (PTAX) para o orçamento das viagens.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 1-5'
  push:
    branches: [fase-0-base]
    paths:
      - tools/dados/cambio.mjs

permissions:
  contents: write

jobs:
  cambio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase-0-base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/dados/cambio.mjs
      - name: Guardar a cotação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/src/dados/cambio.json
          git diff --cached --quiet || git commit -m "Câmbio do Banco Central atualizado"
          git pull --rebase origin fase-0-base
          git push
