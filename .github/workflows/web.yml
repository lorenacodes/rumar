# Versão web do app (D-056): abre no iPhone pelo Safari e vira app com "Adicionar à Tela de Início".
# Grátis no GitHub Pages enquanto o repositório for público. Precisa ligar uma vez:
# Settings → Pages → Source: "GitHub Actions".
name: Web (iPhone)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @rumar/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/dist
      - id: deploy
        uses: actions/deploy-pages@v4
