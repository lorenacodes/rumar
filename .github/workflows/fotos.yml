name: Fotos dos lugares

# Resolve as fotos dos destinos e lugares na Wikipédia/Wikimedia Commons (com autor e
# licença) e grava em apps/app/src/dados/fotos.json e tools/dados/out/fotos.sql.
# Roda quando a lista de lugares muda ou sob demanda.
on:
  workflow_dispatch:
  push:
    branches: [fase-0-base]
    paths:
      - tools/dados/fotos.mjs

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/dados/fotos.mjs
      - name: Guardar o resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/src/dados/fotos.json tools/dados/out/fotos.sql
          git diff --cached --quiet || git commit -m "Fotos dos lugares atualizadas (Wikimedia Commons)"
          git push
